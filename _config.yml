# Kramdown enables "smart typography" by default, which turns runs of hyphens
# into en/em dash characters. The table separator (|---|) then stopped being a
# separator and the whole projects table rendered as raw text.
# We disable this conversion - hyphens must stay plain ASCII hyphens.
markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: ["apos", "apos", "quot", "quot"]
  typographic_symbols:
    hellip: "..."
    mdash: "---"
    ndash: "--"
