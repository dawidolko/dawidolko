<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" role="img" aria-label="Airline Passenger Classifier">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1d3557"/>
      <stop offset="100%" style="stop-color:#0b1b30"/>
    </linearGradient>
    <linearGradient id="plane" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a8dadc"/>
      <stop offset="100%" style="stop-color:#457b9d"/>
    </linearGradient>
  </defs>
  <!-- Rounded sky panel -->
  <rect x="10" y="10" width="100" height="120" rx="22" fill="url(#sky)" stroke="#457b9d" stroke-width="2.5"/>
  <!-- Airplane (ascending) -->
  <g transform="rotate(-32 60 64)">
    <path fill="url(#plane)" stroke="#e63946" stroke-width="1.5"
          d="M58 30 C63 30 66 38 66 52 V70 L86 84 V92 L66 86 V104 L74 112 V118 L58 113 L42 118 V112 L50 104 V86 L30 92 V84 L50 70 V52 C50 38 53 30 58 30 Z"/>
  </g>
  <!-- Flight path -->
  <path fill="none" stroke="#f1faee" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 6" opacity="0.7"
        d="M22 112 C38 100 50 92 74 56"/>
  <!-- Neural-network / MLP nodes (classification) -->
  <circle cx="28" cy="40" r="4" fill="#e63946"/>
  <circle cx="28" cy="58" r="4" fill="#f4a261"/>
  <circle cx="92" cy="46" r="4" fill="#2a9d8f"/>
  <path fill="none" stroke="#a8dadc" stroke-width="1.2" stroke-linecap="round" opacity="0.8"
        d="M28 40 L48 50 M28 58 L48 56 M72 52 L92 46"/>
  <!-- Class indicators (3 classes) -->
  <rect x="40" y="120" width="8" height="6" rx="2" fill="#2a9d8f"/>
  <rect x="56" y="120" width="8" height="6" rx="2" fill="#f4a261"/>
  <rect x="72" y="120" width="8" height="6" rx="2" fill="#e63946"/>
</svg>
