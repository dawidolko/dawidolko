<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" role="img" aria-label="ZbudujKompa">
  <defs>
    <linearGradient id="zkPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111a20"/>
      <stop offset="100%" style="stop-color:#0a1116"/>
    </linearGradient>
    <linearGradient id="zkAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Rounded panel -->
  <rect x="10" y="10" width="100" height="120" rx="22" fill="url(#zkPanel)" stroke="#06b6d4" stroke-width="2.5"/>
  <!-- PC case outline -->
  <rect x="34" y="30" width="52" height="76" rx="7" fill="none" stroke="#06b6d4" stroke-width="2.5"/>
  <!-- Motherboard mounting pins on the case edges -->
  <g fill="#06b6d4" opacity="0.55">
    <rect x="27" y="44" width="6" height="2.5" rx="1.25"/>
    <rect x="27" y="56" width="6" height="2.5" rx="1.25"/>
    <rect x="27" y="68" width="6" height="2.5" rx="1.25"/>
    <rect x="87" y="44" width="6" height="2.5" rx="1.25"/>
    <rect x="87" y="56" width="6" height="2.5" rx="1.25"/>
    <rect x="87" y="68" width="6" height="2.5" rx="1.25"/>
  </g>
  <!-- CPU / heatsink block -->
  <rect x="45" y="40" width="30" height="30" rx="4" fill="url(#zkAccent)" opacity="0.9"/>
  <g stroke="#0a1116" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <path d="M52 46v18"/>
    <path d="M60 46v18"/>
    <path d="M68 46v18"/>
  </g>
  <!-- GPU / expansion card -->
  <rect x="42" y="78" width="36" height="9" rx="2.5" fill="#22d3ee" opacity="0.75"/>
  <!-- Assembly arrow: parts coming together -->
  <path d="M60 118V96M60 96l-6.5 6.5M60 96l6.5 6.5" fill="none" stroke="#e6fbff"
        stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
