<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" role="img" aria-label="BodyKit Shop">
  <defs>
    <linearGradient id="bkPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1d26"/>
      <stop offset="100%" style="stop-color:#0f1115"/>
    </linearGradient>
    <linearGradient id="bkBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8c3a"/>
      <stop offset="100%" style="stop-color:#ff6b1a"/>
    </linearGradient>
  </defs>
  <!-- Rounded panel -->
  <rect x="10" y="10" width="100" height="120" rx="22" fill="url(#bkPanel)" stroke="#ff6b1a" stroke-width="2.5"/>
  <!-- Speed lines -->
  <g stroke="#ff6b1a" stroke-width="2.5" stroke-linecap="round" opacity="0.55">
    <path d="M20 40h16"/>
    <path d="M20 50h24"/>
    <path d="M20 60h14"/>
  </g>
  <!-- Tuned car silhouette with body kit -->
  <g transform="translate(0 6)">
    <!-- Front splitter / body kit -->
    <path fill="#f6f7f9" d="M22 92h76v5H22z" opacity="0.9"/>
    <!-- Main body -->
    <path fill="url(#bkBody)" stroke="#f6f7f9" stroke-width="1.5" stroke-linejoin="round"
          d="M24 92V80c0-4 3-7 7-8l10-2 9-9c2-2 5-3 8-3h14c4 0 7 2 9 5l7 10 6 2c3 1 5 3 5 6v11H24Z"/>
    <!-- Windows -->
    <path fill="#0f1115" opacity="0.75"
          d="M52 63h14c2 0 4 1 5 3l5 7H45l7-9c0-1 0-1 0-1Z"/>
    <!-- Side skirt accent -->
    <path fill="#f6f7f9" d="M30 86h58v4H30z" opacity="0.35"/>
    <!-- Wheels -->
    <circle cx="42" cy="92" r="9" fill="#0f1115" stroke="#f6f7f9" stroke-width="2.5"/>
    <circle cx="42" cy="92" r="3.5" fill="#ff6b1a"/>
    <circle cx="84" cy="92" r="9" fill="#0f1115" stroke="#f6f7f9" stroke-width="2.5"/>
    <circle cx="84" cy="92" r="3.5" fill="#ff6b1a"/>
  </g>
  <!-- Rear wing (tuning kit) -->
  <path fill="#f6f7f9" d="M96 66h14v4H96z" opacity="0.9"/>
  <path stroke="#f6f7f9" stroke-width="2.5" stroke-linecap="round" d="M100 70v6"/>
  <!-- Shop tag -->
  <g transform="translate(18 104)">
    <path fill="#ff6b1a" d="M0 4a4 4 0 0 1 4-4h13l10 10-13 13L4 13a4 4 0 0 1-4-4V4Z" opacity="0.9"/>
    <circle cx="8" cy="8" r="2.5" fill="#0f1115"/>
  </g>
</svg>
