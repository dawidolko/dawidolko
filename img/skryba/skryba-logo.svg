<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Skryba">
  <style>
    .tusz { fill: #14171D; }
    .akcent { fill: #B45309; }
    @media (prefers-color-scheme: dark) {
      .tusz { fill: #ECEDF0; }
      .akcent { fill: #F5B653; }
    }
  </style>
  <!--
    Makieta: miniatura ukladu strony z akcentowym inicjalem — wspolczesna
    wersja rubrykowanej pierwszej litery manuskryptu. Inicjal w bursztynie,
    reszta ukladu w tuszu.
  -->
  <rect x="13" y="13" width="20" height="20" rx="2.5" class="akcent"/>
  <rect x="37" y="13" width="14" height="20" rx="2" class="tusz"/>
  <rect x="13" y="37" width="38" height="7.5" rx="2" class="tusz"/>
  <rect x="13" y="48" width="27" height="6" rx="2" class="tusz"/>
</svg>
