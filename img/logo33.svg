<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" role="img" aria-label="Wine Quality Classifier">
  <defs>
    <linearGradient id="wineBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7b1e3b"/>
      <stop offset="100%" style="stop-color:#4a0d22"/>
    </linearGradient>
    <linearGradient id="wineFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c9184a"/>
      <stop offset="100%" style="stop-color:#8a1538"/>
    </linearGradient>
  </defs>
  <!-- Glass bowl -->
  <path fill="url(#wineBody)" stroke="#e0aaff" stroke-width="2.5"
        d="M34 16 H86 C86 48 74 66 60 66 C46 66 34 48 34 16 Z"/>
  <!-- Wine inside -->
  <path fill="url(#wineFill)"
        d="M40 30 H80 C79 50 70 60 60 60 C50 60 41 50 40 30 Z"/>
  <!-- Surface highlight -->
  <ellipse cx="60" cy="30" rx="20" ry="3.5" fill="#ff5d8f" opacity="0.55"/>
  <!-- Stem -->
  <rect x="57" y="66" width="6" height="38" rx="3" fill="#e0aaff"/>
  <!-- Base -->
  <rect x="38" y="104" width="44" height="7" rx="3.5" fill="#e0aaff"/>
  <!-- Classification data points (quality classes) -->
  <circle cx="60" cy="40" r="4.5" fill="#ffd166"/>
  <circle cx="50" cy="46" r="3" fill="#fcbf49" opacity="0.9"/>
  <circle cx="70" cy="46" r="3" fill="#fcbf49" opacity="0.9"/>
  <path fill="none" stroke="#ffd166" stroke-width="1.4" stroke-linecap="round" opacity="0.85"
        d="M60 40 L50 46 M60 40 L70 46"/>
  <!-- Quality bars (bottom) -->
  <rect x="44" y="122" width="6" height="10" rx="2" fill="#c9184a"/>
  <rect x="54" y="118" width="6" height="14" rx="2" fill="#ff5d8f"/>
  <rect x="64" y="124" width="6" height="8" rx="2" fill="#e0aaff"/>
</svg>
